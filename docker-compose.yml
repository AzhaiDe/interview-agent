services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: offerpilot
      POSTGRES_USER: offerpilot
      POSTGRES_PASSWORD: offerpilot-dev-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - offerpilot-postgres:/var/lib/postgresql/data
    networks:
      - offerpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offerpilot -d offerpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 前端应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - offerpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 后端应用
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4310:4310"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4310
      - DATABASE_PATH=/app/data/db.sqlite
      - UPLOAD_DIR=/app/data/uploads
      - DATABASE_URL=postgresql://offerpilot:offerpilot-dev-password@postgres:5432/offerpilot
    volumes:
      - backend-data:/app/data
    networks:
      - offerpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4310/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  # Nginx 反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - offerpilot-network
    restart: unless-stopped
    profiles:
      - production

networks:
  offerpilot-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
  offerpilot-postgres:
    driver: local
