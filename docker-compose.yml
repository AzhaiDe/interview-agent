version: '3.8'

services:
  # 前端应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - offerpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 后端应用
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4310:4310"
    environment:
      - NODE_ENV=production
      - PORT=4310
      - DATABASE_PATH=/app/data/db.sqlite
      - MEMORY_SERVICE_URL=${MEMORY_SERVICE_URL:-}
    volumes:
      - backend-data:/app/data
    networks:
      - offerpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4310/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx 反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - offerpilot-network
    restart: unless-stopped
    profiles:
      - production

networks:
  offerpilot-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
